services:

  db:
    image: postgres:16
    container_name: gestor_peliculas_db

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "127.0.0.1:${DB_PORT}:5432"

    volumes:
      - peliculas_data:/var/lib/postgresql/data


  pgadmin:
    image: dpage/pgadmin4
    container_name: gestor_peliculas_pgadmin

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    ports:
      - "127.0.0.1:${PGADMIN_PORT}:80"


volumes:
  peliculas_data: